nth-child(3){background:linear-gradient(135deg,#fff,#e0f5f4)}.stat:nth-child(4){background:linear-gradient(135deg,#fff,#e4f0e9)}.stat b{display:block;font-size:32px;color:var(--deep)}.stat span{font-size:13px;color:#856e71}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.section{margin-top:17px}.section h3{margin:0 0 13px;color:#8f3c49;font-size:19px}.two{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}.full{grid-column:1/-1}.muted{color:#908183;font-size:13px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #f1e6e7;vertical-align:middle}th{color:#80646b;background:#fbf5f3}input,select,textarea{border:1px solid #e5d6d6;background:#fff;border-radius:10px;padding:10px;color:#413b40;max-width:100%}textarea{width:100%;min-height:90px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.toolbar input{min-width:170px}.pill{padding:3px 9px;border-radius:20px;background:#e5f1ec;color:#477c63;font-size:12px;white-space:nowrap}.pill.wait{background:#fff0d9;color:#946423}.pill.red{background:#f9e3e6;color:#a33f4e}.pill.blue{background:#dff3f3;color:#287c80}.priority{color:#ab4454;font-weight:800}details{margin:10px 0;border:1px solid #eee0df;padding:12px;border-radius:12px}summary{cursor:pointer;color:#854853;font-weight:700}.actions button{padding:5px 9px;font-size:12px}.hidden{display:none!important}.empty{padding:22px;color:#988; text-align:center;border:1px dashed #ddcacc;border-radius:12px}label{display:block;font-size:13px;color:#82636b;margin-top:10px;margin-bottom:3px}dialog{border:0;border-radius:18px;padding:23px;width:min(580px,94vw);box-shadow:0 15px 80px #4228}dialog::backdrop{background:#33272b99}dialog input,dialog select{width:100%}.notice{background:#fff8ec;border-left:4px solid #dfa66d;padding:11px 15px;border-radius:8px}.footer{margin:24px 0;color:#9c868c;font-size:12px}.hide-mobile{}@media(max-width:900px){aside{width:74px;pad </style></head><body><div class="layout"><aside><h1>BKE</h1><small>Better Know Each Other</small><nav id="nav"></nav><p class="muted hide-mobile" style="padding:20px 12px">Good People · Good Business<br>🌸 記錄每次對話，創造更好的合作</p></aside><main><div class="top"><div><h2 id="heading">客戶 LINE 智慧管理系統</h2><p id="sub">BKE 業務協作・每日進度・日報週報</p></div><span class="tag">🌷 前端試用版｜本機儲存</span></div><div class="banner"><strong>你好，Yellow！☀️</strong><p>把每一次客戶對話，整理成下一步行動。</p></div><div id="view"></div><div class="footer">BKE CRM V1.1｜資料僅儲存在目前瀏覽器，尚未啟用多人帳號、雲端同步或 AI API。請勿以公開 GitHub 儲存庫存放客戶機密資料。</div></main></div><dialog id="dialog"><h3 id="dialogtitle" style="color:#803b49;margin:0">新增資料</h3><form id="editor" method="dialog"><div id="fields"></div><div class="row" style="margin-top:18px"><button type="button" class="secondary" onclick="document.querySelector('#dialog').close()">取消</button><button type="submit">儲存</button></div></form></dialog><script>
const NAV=[["home","⌂","首頁儀表板"],["upload","◉","LINE 紀錄上傳"],["clients","♙","客戶管理"],["projects","▤","案件進度"],["quotes","▣","報價管理"],["orders","▧","訂單交貨"],["summaries","✎","客戶對話摘要"],["reports","▥","日報週報"],["reminders","♧","每日提醒"],["settings","⚙","設定"]],KEY="bke-crm-v1-demo";
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){} db=db||{clients:[],projects:[],tasks:[],quotes:[],orders:[],messages:[],imports:[]};for(const k of ["clients","projects","tasks","quotes","orders","messages","imports"])db[k]||=[];
let page="home",selectedClient="",reportType="daily";
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),today=()=>new Date().toLocaleDateString("sv-SE"),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()},clientName=x=>db.clients.find(c=>c.id===x)?.name||"未配對",projectName=x=>db.projects.find(p=>p.id===x)?.name||"—",status=x=>'<span class="pill '+(x==="待處理"||x==="未交貨"?"wait":x==="未完成"?"red":x==="處理中"||x==="部分交貨"?"blue":"")+'">'+esc(x||"未設定")+'</span>',fmt=n=>Number(n||0).toLocaleString("zh-TW"),filterToday=x=>String(x||"").slice(0,10)===today(),table=(heads,rows)=>'<div class="scroll"><table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join("")+'</tr></thead><tbody>'+ (rows.length?rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join("")+'</tr>').join(""):'<tr><td colspan="'+heads.length+'" class="empty">尚無資料，可按新增或上傳建立紀錄</td></tr>')+'</tbody></table></div>';
function go(p){page=p;render();window.scrollTo({top:0,behavior:"smooth"})}
function btn(label,fn,secondary=false){return '<button '+(secondary?'class="secondary" ':'')+'onclick="'+fn+'">'+label+'</button>'}
function pillCount(label,n){return '<div class="card stat"><span>'+label+'</span><b>'+fmt(n)+'</b><small class="muted">筆 / 件</small></div>'}
function sel(arr,prop="name"){return arr.map(a=>'<option value="'+esc(a.id)+'">'+esc(a[prop])+'</option>').join("")}
function panel(title,content,action=""){return '<div class="card section"><div class="row"><h3>'+title+'</h3>'+action+'</div>'+content+'</div>'}
function priority(t){if(t.status==="已完成")return 9;if(t.due&&t.due<today())return 0;if(t.priority==="P0")return 0;if(t.due===today()||t.priority==="P1")return 1;return t.priority==="P2"?2:3}
function ordered(){return [...db.tasks].filter(t=>t.status!=="已完成").sort((a,b)=>priority(a)-priority(b)||(a.due||"9999").localeCompare(b.due||"9999"))}
function taskRows(ts){return ts.map(t=>[esc(clientName(t.client)),esc(t.title),'<strong class="priority">P'+Math.min(3,priority(t))+'</strong>',status(t.status),esc(t.due||"未設定"),esc(t.owner||"—"),'<div class="actions">'+btn("編輯","edit('tasks','"+t.id+"')",true)+" "+btn("完成","complete('"+t.id+"')")+'</div>'])}
function home(){let pending=ordered();return '<div class="grid">'+pillCount("今日待辦",pending.filter(t=>t.due===today()).length)+pillCount("處理中案件",db.projects.filter(p=>p.status==="處理中").length)+pillCount("待處理事項",pending.filter(t=>t.status==="待處理").length)+pillCount("未交貨訂單",db.orders.filter(o=>o.status!=="已交貨").length)+'</div><div class="two">'+panel("🔔 今日重要事項",table(["客戶","工作事項","優先","狀態","期限","負責人","操作"],taskRows(pending.slice(0,8))),btn("全部提醒","go('reminders')",true))+panel("🌿 客戶進度總覽",'<div class="grid" style="grid-template-columns:repeat(2,1fr)">'+["已完成","未完成","待處理","處理中"].map(s=>pillCount(s,db.tasks.filter(t=>t.status===s).length)).join("")+'</div>')+'</div><div class="two">'+panel("📄 報價與訂單",'<div class="grid" style="grid-template-columns:repeat(2,1fr)">'+pillCount("報價紀錄",db.quotes.length)+pillCount("已交貨",db.orders.filter(o=>o.status==="已交貨").length)+'</div>')+panel("🌸 快速操作",'<div class="toolbar">'+btn("上傳 LINE","go('upload')")+btn("新增客戶","edit('clients')")+btn("新增待辦","edit('tasks')")+btn("產生日報","go('reports')")+'</div><p class="muted">客戶資料僅在這台裝置保存；正式跨業務協作需另接後端。</p>')+'</div>'}
function listPage(type,title,heads,make){return panel(title,table(heads,db[type].map(make)),btn("＋ 新增","edit('"+type+"')"))}
function clients(){return '<div class="toolbar"><input id="query" placeholder="搜尋客戶名稱／編號" oninput="renderClientTable()">'+btn("＋ 新增客戶","edit('clients')")+'</div><div id="clientTable"></div>'}
function renderClientTable(){let q=($("#query")?.value||"").toLowerCase(),rows=db.clients.filter(c=>(c.name+c.code).toLowerCase().includes(q)).map(c=>[esc(c.code),esc(c.name),esc(c.contact||"—"),esc(c.owner||"—"),fmt(db.projects.filter(p=>p.client===c.id).length),btn("查看","openClient('"+c.id+"')",true)+" "+btn("編輯","edit('clients','"+c.id+"')",true)]);$("#clientTable").innerHTML=panel("客戶資料總覽",table(["編號","客戶名稱","聯絡窗口","負責業務","案件數","操作"],rows))}
function openClient(cid){selectedClient=cid;page="clientDetail";render()}
function detail(){let c=db.clients.find(x=>x.id===selectedClient);if(!c)return clients();let p=db.projects.filter(x=>x.client===c.id),ts=db.tasks.filter(x=>x.client===c.id),msgs=db.messages.filter(x=>x.client===c.id);return panel("🌺 "+esc(c.name)+'｜客戶工作空間','<p>客戶編號：'+esc(c.code)+'　聯絡人：'+esc(c.contact||"—")+'　負責業務：'+esc(c.owner||"—")+'</p><p class="muted">'+esc(c.note||"尚無備註")+'</p><div class="toolbar">'+btn("修改資料","edit('clients','"+c.id+"')")+btn("新增產品案件","edit('projects')")+btn("返回客戶列表","go('clients')",true)+'</div>')+panel("產品案件",table(["產品案件","狀態","負責人","操作"],p.map(x=>[esc(x.name),status(x.status),esc(x.owner),btn("編輯","edit('projects','"+x.id+"')",true)])))+panel("任務進度",table(["客戶","事項","優先","狀態","期限","負責人","操作"],taskRows(ts)))+panel("歷史 LINE 訊息（最近 40 筆）",table(["日期","發言人","內容"],msgs.slice(-40).reverse().map(m=>[esc(m.date),esc(m.speaker),esc(m.text)])))}
function upload(){return panel("☁️ LINE 聊天紀錄匯入",'<p>可一次選擇多份 LINE 匯出的 TXT 檔案。解析後可指定客戶，並由你確認需要建立的待辦。</p><input type="file" id="files" accept=".txt,text/plain" multiple><div class="toolbar" style="margin-top:12px">'+btn("解析檔案","parseUploads()")+'</div><p class="notice">本版本提供規則式 TXT 解析及日期／發言人整理，尚未串接 AI 語意摘要。請勿將規則式結果當作正式決議或報價依據。</p>')+panel("最近匯入紀錄",table(["日期","檔名","客戶","新增訊息","操作"],db.imports.slice().reverse().map(x=>[esc(x.date),esc(x.file),esc(clientName(x.client)),fmt(x.count),btn("查看訊息","showImport('"+x.id+"')",true)])))}
async function parseUploads(){let files=[...($("#files").files||[])];if(!files.length)return alert("請先選擇 TXT 檔案");for(const f of files){let text=await f.text(),group=f.name.replace(/\.txt$/i,""),c=db.clients.find(x=>group.includes(x.name)||group.includes(x.code));if(!c){let entered=prompt("檔案："+f.name+"\n請輸入對應客戶名稱（若是新客戶將建立客戶檔）",group.replace(/^\[LINE\]\s*/,"").replace(/的聊天.*/,""));if(!entered)continue;c=db.clients.find(x=>x.name===entered)||{id:id(),name:entered,code:"",contact:"",owner:"Yellow"};if(!db.clients.some(x=>x.id===c.id))db.clients.push(c)}let lines=text.split(/\r?\n/),batch=id(),count=0,seen=new Set(db.messages.map(m=>m.key));let currentDate=today();for(let line of lines){let dateLine=line.match(/^(\d{4}[\/.-]\d\d?[\/.-]\d\d?)/);if(dateLine&&!/^\d\d?:\d\d?\s/.test(line))currentDate=dateLine[1].replaceAll("/","-").replaceAll(".","-");let m=line.match(/^(\d{1,2}:\d{2})\s+([^\t]+)\t(.+)$/)||line.match(/^\[?(\d{1,2}:\d{2})\]?\s+([^:：]{1,35})[:：]\s*(.+)$/);if(!m)continue;let key=[c.id,currentDate,m[1],m[2],m[3]].join("|");if(seen.has(key))continue;db.messages.push({id:id(),key,client:c.id,date:currentDate+" "+m[1],speaker:m[2],text:m[3],batch});seen.add(key);count++}db.imports.push({id:batch,date:today(),file:f.name,client:c.id,count})}save();alert("已完成基礎解析，可於匯入紀錄查看；未辨識訊息格式不會匯入。")}
function showImport(batch){let x=db.imports.find(t=>t.id===batch);if(!x)return;let messages=db.messages.filter(m=>m.batch===batch);let body=messages.map(m=>m.date+" "+m.speaker+"："+m.text).join("\n");$("#dialogtitle").textContent=x.file+"｜解析結果";$("#fields").innerHTML='<p>匯入訊息 '+messages.length+' 筆</p><textarea readonly style="height:250px">'+esc(body)+'</textarea><p class="muted">請依實際需求，手動新增案件及任務。</p>';$("#editor").onsubmit=e=>{e.preventDefault();$("#dialog").close()};$("#dialog").showModal()}
const SCHEMAS={clients:[["name","客戶名稱","text"],["code","客戶編號","text"],["contact","聯絡人","text"],["owner","負責業務","text"],["note","備註","textarea"]],projects:[["client","所屬客戶","client"],["name","產品／案件名稱","text"],["status","案件狀態","status"],["owner","負責人","text"],["note","產品規格／需求","textarea"]],tasks:[["client","所屬客戶","client"],["project","所屬案件（可選）","project"],["title","工作事項","text"],["status","進度狀態","status"],["priority","優先級","priority"],["due","預定完成日","date"],["owner","負責人","text"]],quotes:[["client","所屬客戶","client"],["project","案件","project"],["number","報價單號","text"],["amount","總金額（NT$）","number"],["date","報價日期","date"],["status","報價狀態","quoteStatus"]],orders:[["client","所屬客戶","client"],["project","案件","project"],["number","訂單編號","text"],["quantity","訂購數量","number"],["delivered","已交貨數量","number"],["amount","訂單金額（NT$）","number"],["due","預定交貨日","date"]]};
function opts(values,current){return values.map(x=>'<option value="'+esc(x)+'" '+(x===current?'selected':'')+'>'+esc(x)+'</option>').join("")}
function edit(type,record=""){let schema=SCHEMAS[type],item=db[type].find(t=>t.id===record)||{};$("#dialogtitle").textContent=(record?"編輯":"新增")+({clients:"客戶",projects:"案件",tasks:"工作事項",quotes:"報價",orders:"訂單"}[type]);$("#fields").innerHTML=schema.map(([key,label,kind])=>'<label>'+label+'</label>'+(kind==="textarea"?'<textarea name="'+key+'">'+esc(item[key])+'</textarea>':["client","project","status","priority","quoteStatus"].includes(kind)?'<select name="'+key+'">'+(kind==="client"?'<option value="">請選擇客戶</option>'+sel(db.clients):kind==="project"?'<option value="">未指定</option>'+sel(db.projects):kind==="status"?opts(["待處理","處理中","未完成","已完成"],item[key]):kind==="priority"?opts(["P0","P1","P2","P3"],item[key]||"P2"):opts(["草稿","已提供","待確認","已接受","未成交"],item[key]))+'</select>':'<input name="'+key+'" type="'+kind+'" value="'+esc(item[key]||"")+'">')).join("");if(record)$("#fields").innerHTML+='<p class="muted">修改後會更新目前資料；請定期匯出 JSON 備份。</p>';$("#editor").onsubmit=e=>{e.preventDefault();let fd=new FormData($("#editor")),next={...item,id:item.id||id()};for(let [key] of schema)next[key]=fd.get(key);if(type==="orders"){next.quantity=Math.max(0,Number(next.quantity)||0);next.delivered=Math.min(next.quantity,Math.max(0,Number(next.delivered)||0));next.status=next.delivered===0?"未交貨":next.delivered>=next.quantity?"已交貨":"部分交貨"}if(!next.name&&type==="clients"||!next.title&&type==="tasks"||!next.name&&type==="projects"){alert("請填寫必要名稱／事項");return}let idx=db[type].findIndex(x=>x.id===record);if(idx>=0)db[type][idx]=next;else db[type].push(next);$("#dialog").close();save()};$("#dialog").showModal()}
function complete(taskId){let t=db.tasks.find(x=>x.id===taskId);if(t){t.status="已完成";t.completedAt=today();save()}}
function projects(){return listPage("projects","📁 產品案件管理",["客戶","產品案件","狀態","負責人","操作"],p=>[esc(clientName(p.client)),esc(p.name),status(p.status),esc(p.owner||"—"),btn("編輯","edit('projects','"+p.id+"')",true)])+panel("工作進度追蹤",table(["客戶","工作事項","優先","狀態","期限","負責人","操作"],taskRows(db.tasks)),btn("＋ 新增工作","edit('tasks')"))}
function quotes(){return listPage("quotes","📄 報價管理",["客戶","報價單號","案件","金額","報價日期","狀態","操作"],q=>[esc(clientName(q.client)),esc(q.number),esc(projectName(q.project)),"NT$ "+fmt(q.amount),esc(q.date),status(q.status),btn("編輯","edit('quotes','"+q.id+"')",true)])}

function reminders(){return panel("🔔 每日重要事項・優先排序",'<p class="muted">依逾期、今日到期及手動優先級排序，無法從 LINE 自動判斷已完成工作。</p>'+table(["客戶","工作事項","優先","狀態","期限","負責人","操作"],taskRows(ordered())),btn("＋ 新增提醒","edit('tasks')"))}
function reportData(){let all=reportType==="daily"?db.tasks.filter(t=>filterToday(t.due)||filterToday(t.completedAt)):db.tasks;return all}
function reports(){let ts=reportData();return panel("📊 客戶日報／週報中心",'<div class="toolbar"><select id="reportkind" onchange="reportType=this.value;render()"><option value="daily" '+(reportType==="daily"?"selected":"")+'>今日日報</option><option value="weekly" '+(reportType==="weekly"?"selected":"")+'>工作進度彙總（週報預覽）</option></select>'+btn("匯出 CSV","exportReport()")+btn("列印／存為 PDF","window.print()",true)+'</div><div id="reportPrint"><h3>BKE '+(reportType==="daily"?"客戶日報":"客戶工作彙總")+'</h3><p>產生日期：'+today()+'</p><p>已完成 '+ts.filter(t=>t.status==="已完成").length+' 件 ｜ 未完成 '+ts.filter(t=>t.status==="未完成").length+' 件 ｜ 待處理 '+ts.filter(t=>t.status==="待處理").length+' 件 ｜ 處理中 '+ts.filter(t=>t.status==="處理中").length+' 件</p>'+table(["客戶","工作事項","優先級","狀態","預定日期","負責人"],ts.map(t=>[esc(clientName(t.client)),esc(t.title),esc(t.priority),status(t.status),esc(t.due),esc(t.owner)]))+'<h3>報價及訂單</h3><p>報價 '+db.quotes.length+' 筆 ｜ 訂單 '+db.orders.length+' 筆 ｜ 未交貨 '+db.orders.filter(o=>o.status!=="已交貨").length+' 筆</p></div><p class="notice">週報目前為既有工作彙總預覽，尚未實作按週的歷史事件快照或 AI 歸納；正式週報需新增歷史變更紀錄。</p>')}
function download(name,content,type){let a=document.createElement("a"),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportReport(){let h=["客戶","事項","優先級","狀態","日期","負責人"],rows=reportData().map(t=>[clientName(t.client),t.title,t.priority,t.status,t.due,t.owner]),csv="\ufeff"+[h,...rows].map(r=>r.map(x=>'"'+String(x??"").replaceAll('"','""')+'"').join(",")).join("\r\n");download("BKE_"+reportType+"_"+today()+".csv",csv,"text/csv;charset=utf-8")}
function backup(){download("BKE_CRM_備份_"+today()+".json",JSON.stringify(db,null,2),"application/json")}
async function restore(el){let f=el.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.clients)||!Array.isArray(obj.tasks))throw Error("資料格式不符");if(!confirm("將覆蓋此瀏覽器的所有目前資料，確定還原？"))return;db=obj;save()}catch(e){alert("備份讀取失敗："+e.message)}}
function settings(){return panel("⚙ 系統資料維護",'<p>目前是 GitHub Pages 前端版本，沒有雲端資料庫或真正的員工登入權限。</p><div class="toolbar">'+btn("下載 JSON 備份","backup()")+'<label style="margin:0">匯入備份 <input type="file" accept=".json" onchange="restore(this)"></label></div><p class="notice">資料僅在你的瀏覽器 localStorage 保存。換裝置、清除網站資料或使用其他瀏覽器，都不會自動同步。</p><p class="muted">正式企業版應採用登入權限、私有資料庫、稽核紀錄、AI 後端分析與每日排程通知。</p>')}
function render(){let nav=$("#nav");nav.innerHTML=NAV.map(([p,icon,name])=>'<button data-icon="'+icon+'" class="'+(p===page?"active":"")+'" onclick="go(\''+p+'\')">'+icon+'　'+name+'</button>').join("");let names={home:"首頁儀表板",upload:"LINE 紀錄上傳",clients:"客戶管理",clientDetail:"客戶工作空間",projects:"案件進度",quotes:"報價管理",orders:"訂單交貨",summaries:"客戶對話摘要",reports:"日報週報",reminders:"每日提醒",settings:"系統設定"};$("#heading").textContent="BKE｜"+names[page];$("#view").innerHTML=({home,upload,clients,clientDetail:detail,projects,quotes,orders,summaries,reports,reminders,settings}[page]||home)();if(page==="clients")renderClientTable()}

function customerFromFile(file){let name=file.replace(/\.txt$/i,"").replace(/^\[LINE\]\s*/i,"").replace(/^百達醫(?:Y|&)?[-_#@\s]*/,"").replace(/的聊天.*$/,"").trim(),match=name.match(/\((\d{3,6})\)/),code=match?.[1]||"",label=name.replace(/\(\d{3,6}\)/g,"").replace(/^[#@_-]+/,"").trim(),client=db.clients.find(c=>code&&c.code===code)||db.clients.find(c=>c.name===label);if(!client){client={id:id(),name:label||name,code,owner:"Yellow",contact:""};db.clients.push(client)}return client}
function categoryFor(v){if(/已完成|完成了|已寄出|已交貨|已出貨|已確認|已提供|已收到/.test(v))return "已完成";if(/打樣中|製作中|生產中|處理中|進行中|審核中/.test(v))return "處理中";if(/尚未|未完成|還沒|未收到|延期|延遲/.test(v))return "未完成";if(/報價|請問|請|麻煩|需要|希望|是否|確認|交期|想要|可否|何時|跟進/.test(v))return "待處理";return "一般討論"}
function clientSummaryMarkup(cid,from="",to=""){let m=db.messages.filter(x=>x.client===cid&&(!from||x.date.slice(0,10)>=from)&&(!to||x.date.slice(0,10)<=to)).sort((a,b)=>a.date.localeCompare(b.date));if(!m.length)return '<p class="empty">尚未匯入此客戶的 LINE 對話</p>';const buckets=["已完成","未完成","待處理","處理中","一般討論"];let line=x=>'<div style="padding:8px;border-bottom:1px solid #f4e7e7"><span class="muted">'+esc(x.date)+'｜'+esc(x.speaker)+'</span><div>'+esc(x.text)+'</div></div>';return '<p>對話共 '+m.length+' 則；最後更新 '+esc(m.at(-1).date)+'</p><p class="notice">以下是關鍵字分類的客戶對話摘錄，不是經 AI 驗證的完成狀態、正式報價或訂單。請依原始訊息人工確認。</p>'+buckets.map(k=>{let rows=m.filter(x=>categoryFor(x.text)===k);return '<details open><summary>'+k+'（'+rows.length+'）</summary>'+ (rows.length?rows.slice(-30).reverse().map(line).join(""):'<span class="muted">尚無符合訊息</span>')+'</details>'}).join("")+'<details><summary>依日期查看原始對話</summary>'+[...new Set(m.map(x=>x.date.slice(0,10)))].reverse().map(day=>'<details><summary>'+esc(day)+'</summary>'+m.filter(x=>x.date.slice(0,10)===day).map(line).join("")+'</details>').join("")+'</details>'}
function summaries(){let cid=selectedClient||db.clients[0]?.id||"";return panel("🌸 每個客戶的 LINE 需求與工作摘要",'<div class="toolbar"><select id="sc" onchange="selectedClient=this.value;updateCustomerSummary()">'+db.clients.map(c=>'<option value="'+esc(c.id)+'" '+(c.id===cid?"selected":"")+'>'+esc(c.name)+'</option>').join("")+'</select><input id="sf" type="date" onchange="updateCustomerSummary()"><input id="st" type="date" onchange="updateCustomerSummary()">'+btn("列印客戶摘要","window.print()",true)+'</div><div id="summaryarea">'+clientSummaryMarkup(cid)+'</div>')}
function updateCustomerSummary(){selectedClient=$("#sc").value;$("#summaryarea").innerHTML=clientSummaryMarkup(selectedClient,$("#sf").value,$("#st").value)}
function openCustomerSummary(cid){selectedClient=cid;go("summaries")}
upload=function(){return panel("☁️ LINE TXT 批次上傳｜依檔名識別客戶",'<p>每個 LINE TXT 檔案視為單一客戶；同客戶多次上傳會累積到同一檔案，並以訊息時間與內容去重。</p><input type="file" id="files" accept=".txt" multiple><div class="toolbar" style="margin-top:12px">'+btn("上傳並整理","parseUploads()")+btn("查看客戶摘要","go('summaries')",true)+'</div><p class="notice">尚未串接 AI API。對話摘要採關鍵字初步分類，需人工確認；無法解析的特殊 LINE 格式可能遺漏。</p>')+panel("匯入紀錄",table(["匯入日期","檔案名稱","客戶","新增訊息","操作"],db.imports.slice().reverse().map(x=>[esc(x.date),esc(x.file),esc(clientName(x.client)),fmt(x.count),btn("摘要","openCustomerSummary('"+x.client+"')",true)])))};
parseUploads=async function(){let files=[...($("#files").files||[])];if(!files.length)return alert("請先選擇聊天紀錄 TXT 檔");let count=0;for(let f of files){let c=customerFromFile(f.name),content=await f.text(),batch=id(),n=0,date=today(),known=new Set(db.messages.map(x=>x.key));for(let line of content.split(/\r?\n/)){let dm=line.match(/^\s*(\d{4}[\/.-]\d{1,2}[\/.-]\d{1,2})(?:\s|$)/);if(dm){date=dm[1].replace(/[/.]/g,"-");continue}let match=line.match(/^(\d{1,2}:\d{2})\s+([^\t]+)\t(.+)$/)||line.match(/^\[?(\d{1,2}:\d{2})\]?\s+([^:：]{1,35})[:：]\s*(.+)$/);if(!match)continue;let stamp=date+" "+match[1],key=[c.id,stamp,match[2],match[3]].join("|");if(known.has(key))continue;db.messages.push({id:id(),key,client:c.id,date:stamp,speaker:match[2],text:match[3],batch});known.add(key);n++}db.imports.push({id:batch,date:today(),file:f.name,client:c.id,count:n});count+=n}save();alert("完成："+files.length+" 個檔案，新增 "+count+" 則訊息。請在「客戶對話摘要」查看。")};

render();
</script></body></html>
